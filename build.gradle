plugins {
    id 'java-library'
    id 'application'
    id 'org.springframework.boot' version '4.1.0'
    id 'io.spring.dependency-management' version '1.1.7'
    id 'org.openjfx.javafxplugin' version '0.1.0'
    alias libs.plugins.sentry
}

group 'org.geysermc.discordbot'
version '3.0'

repositories {
//    mavenLocal()
    mavenCentral()

    maven {
        url 'https://jitpack.io'
    }

    maven {
        url 'https://repo.opencollab.dev/main'
    }

    maven {
        url 'https://m2.chew.pro/releases/'
    }

    maven {
        url 'https://m2.chew.pro/snapshots/'
    }

    maven {
        url 'https://repo.rtm516.co.uk/main/'
    }
}

javafx {
    version = "11.0.2"
    modules = ['javafx.graphics', 'javafx.swing']
    configuration = 'implementation'
}

dependencies {
    testImplementation libs.junit.jupiter
    testRuntimeOnly libs.junit.launcher

    implementation libs.bundles.jda

    implementation libs.bundles.logging

    // Json for web requests
    implementation libs.json

    implementation libs.bundles.database

    // Pinging java and bedrock servers
    implementation libs.bundles.ping

    implementation libs.reflections
    implementation libs.prettytime
    implementation libs.commonsnet

    // Parsing HTML
    implementation libs.jsoup

    // Github API
    implementation libs.github

    // Spring (oh no)
    implementation libs.bundles.spring
    implementation libs.logback.classic

    // SVG parsing
    implementation libs.bundles.batik

    // Parses stack traces from text
    implementation libs.stackparser

    // Reading RSS feeds
    implementation libs.rome

    // Image processing and OCR
    implementation libs.bundles.ocr

    // Agolia Search (For Wiki)
    implementation libs.algolia

    // Image hasher
    implementation libs.jimagehash

    // Image readers/writers
    implementation libs.imageio.webp
}

jar {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE

    archiveFileName = "${project.name}.jar"

    // Exclude dependency signature files
    exclude "META-INF/*.SF"
    exclude "META-INF/*.DSA"
    exclude "META-INF/*.RSA"

    from {
        configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) }
    }

    manifest {
        attributes (
            'Class-Path': configurations.runtimeClasspath.files.collect { it.getName() }.join(' '),
            'Main-Class': 'org.geysermc.discordbot.GeyserBot'
        )
    }
}

// Allow running with `./gradlew run` task
application {
    mainClass = 'org.geysermc.discordbot.GeyserBot'
}

test {
    useJUnitPlatform()
}

java {
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

sentry {
    // The CI workflow always sets SENTRY_AUTH_TOKEN, so it is an empty string
    // (not null) when the secret is missing - only bundle sources when a
    // token is actually provided.
    includeSourceContext = System.getenv("SENTRY_AUTH_TOKEN") != null && !System.getenv("SENTRY_AUTH_TOKEN").isEmpty()

    org = "geysermc"
    projectName = "geyserdiscordbot"
    authToken = System.getenv("SENTRY_AUTH_TOKEN")
}
