<html>
<head>
    <title>Open Collab Bot</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body>
<div class="flex flex-col h-screen">
    <header class="bg-gray-200 dark:bg-gray-900 text-black dark:text-white p-4">
        <div class="container mx-auto flex justify-between items-center">
            <h1 class="text-2xl font-bold">Open Collab Bot</h1>
            <nav class="flex gap-4 items-center">
                <a href="/" class="hover:text-blue-200">Home</a>
                $[auth:auth_header:unauth_header]
            </nav>
        </div>
    </header>

    <main class="flex-1 bg-gray-100 dark:bg-gray-800 text-black dark:text-white p-8 overflow-y-auto">
        <div class="container mx-auto">
            ![content]
        </div>
    </main>
</div>

</html>
